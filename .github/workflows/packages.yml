name: packages

# Kirana as a user gets it (M4, E-08, KRN-INT-007): the native engine built for every platform, every
# package packed into the tarball it would be published as, and those tarballs installed into the
# examples with every supported package manager on every supported OS. Nothing is published; the
# examples resolve the tarballs through each package manager's override mechanism
# (packages/kirana/examples/run.ts).
#
# Pull requests run a smoke subset (Linux x64 with npm, pnpm and Bun, plus musl); pushes, the nightly
# schedule and manual runs cover the full matrix. Each installation cell is its own job, so a red one
# names the exact platform and package manager; the examples run in shards (see `examples`).
#
# A pull request or push that changes nothing the packages are built from (the site, prose) skips
# everything here (.github/actions/changes). So does the push that merges a Release PR: release.yml
# runs this workflow on that same commit as its gate, and a second copy would only queue behind it.

on:
  push:
    branches: [main, kirana]
  pull_request:
    branches: [main, kirana]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # The release gate: release.yml runs the full matrix again on the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What changed (.github/actions/changes): everything below depends on `native`, so it all skips
  # with it.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      kirana: ${{ steps.changes.outputs.kirana }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

  # One `kirana.<triple>.node` per target in KRN-INT-007. Linux gnu links against napi-rs's glibc 2.17
  # toolchain, so the engine loads on any distribution from the last decade rather than only on the
  # runner's much newer glibc; musl links through Zig; macOS x64 and Windows arm64 cross-compile on the
  # other architecture's runner.
  native:
    name: native (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    # Called by release.yml (`github.workflow` is then the caller's): always. Otherwise only when the
    # packages changed, and never on the Release PR's merge, which release.yml gates itself.
    if: >-
      github.workflow != 'packages' ||
      (needs.changes.outputs.kirana == 'true' &&
       !startsWith(github.event.head_commit.message, 'chore: release '))
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64-gnu
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            flags: --use-napi-cross
          - triple: linux-arm64-gnu
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            flags: --use-napi-cross
          - triple: linux-x64-musl
            os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - triple: linux-arm64-musl
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            flags: --cross-compile
            zig: true
          - triple: darwin-arm64
            os: macos-26
            target: aarch64-apple-darwin
          - triple: darwin-x64
            os: macos-26
            target: x86_64-apple-darwin
          - triple: win32-x64-msvc
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - triple: win32-arm64-msvc
            os: windows-2025
            target: aarch64-pc-windows-msvc
          # The WASI fallback (KRN-INT-006): napi-rs links it against emnapi, no WASI SDK needed.
          - triple: wasm32-wasi
            os: ubuntu-26.04
            target: wasm32-wasip1-threads

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: native-${{ matrix.triple }}
          tools: ${{ matrix.zig && 'cargo-zigbuild' || '' }}

      - name: Add the Rust target
        working-directory: packages/kirana
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # Zig for cargo-zigbuild, from ziglang.org at a pinned version and checksum. Not
      # mlugg/setup-zig: every release of it still declares the deprecated Node 20 runtime.
      - name: Install Zig
        if: matrix.zig
        shell: bash
        run: |
          version=0.16.0
          case "$(uname -m)" in
            x86_64) arch=x86_64 sum=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            aarch64) arch=aarch64 sum=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 ;;
          esac
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$version/zig-$arch-linux-$version.tar.xz"
          echo "$sum  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-$arch-linux-$version" >> "$GITHUB_PATH"

      - name: Build
        working-directory: packages/kirana/npm/compiler
        shell: bash
        run: bun run build --target ${{ matrix.target }} ${{ matrix.flags }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.triple }}
          # The WASI build is the `.wasm` plus the loaders napi-rs writes beside it.
          path: |
            packages/kirana/npm/compiler/kirana.${{ matrix.triple }}.node
            packages/kirana/npm/compiler/kirana.wasm32-wasi.wasm
            packages/kirana/npm/compiler/kirana.wasi*
            packages/kirana/npm/compiler/wasi-worker*.mjs
          if-no-files-found: error
          retention-days: 3

  # Every @kirana-style/* package plus the eight platform packages, as tarballs. `scripts/pack.ts` refuses
  # a package with an install script (D-029).
  pack:
    name: pack
    runs-on: ubuntu-26.04
    needs: [native]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Pack
        run: bun run kirana:pack --natives "$GITHUB_WORKSPACE/natives"

      - name: The compiler package carries no engine of its own
        run: |
          cd packages/kirana/dist-packages
          ! tar -tzf kirana-style-compiler-[0-9]*.tgz | grep -q '\.node$'
          test "$(ls | grep -cE '^kirana-style-compiler-(darwin|linux|win32)-')" -eq 8
          test -f kirana-style-compiler-wasm32-wasi-[0-9]*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages/*.tgz
          if-no-files-found: error
          retention-days: 3

  # The installation matrix: vite-react, because it isolates the package manager. Installs, builds,
  # checks the stylesheet, then reads a probe's computed style (and hover) back in Chromium.
  install:
    name: install (${{ matrix.os }} · ${{ matrix.pm }})
    runs-on: ${{ matrix.os }}
    needs: [pack]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-26.04"]' || '["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26", "windows-2025"]') }}
        pm: ${{ fromJSON(github.event_name == 'pull_request' && '["npm", "pnpm", "bun"]' || '["npm", "pnpm", "yarn", "yarn-pnp", "bun"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bun runs the runner and supplies Playwright; the example itself installs outside the
      # workspace, with the package manager under test.
      - uses: ./.github/actions/setup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: pnpm and Yarn through Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12 --activate
          corepack prepare yarn@4 --activate

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages

      - name: Install Chromium
        working-directory: packages/kirana
        run: bunx playwright install --with-deps chromium

      - name: vite-react with ${{ matrix.pm }}
        run: bun run kirana:example vite-react --pm ${{ matrix.pm }}

  # The WASI engine end to end (KRN-INT-006): installed explicitly, forced, used for a whole build,
  # and required to write the same stylesheet as the native engine on the same project.
  install-wasi:
    name: install (wasi · npm)
    runs-on: ubuntu-26.04
    needs: [pack]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages

      - name: Install Chromium
        working-directory: packages/kirana
        run: bunx playwright install --with-deps chromium

      - name: vite-react on the WASI engine
        run: bun run kirana:example vite-react --pm npm --wasi

  # The compatibility matrix (one example per host and framework, built) and the development servers
  # (KRN-INT-009: the page is styled, and a style edit reaches it, as a CSS hot update without a reload
  # where the framework updates components in place). Linux with npm, since the installation matrix
  # covers the package managers. Each adapter and framework mode adds its example to a shard as it
  # lands (S4-E08-05).
  #
  # Shards, not a job per example: an example takes 20 to 60 seconds, and a job of its own spent as
  # long again on setup and Chromium, then waited in the queue behind sixty others. A shard runs its
  # examples in turn, warms npm's cache for the next one, keeps going past a failure, and names each
  # failure as an annotation (`compat (qwik)`, `dev (qwik)`). Shards group the examples that need the
  # same toolchain and are balanced to a few minutes each.
  examples:
    name: examples (${{ matrix.shard }})
    runs-on: ubuntu-26.04
    needs: [pack]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: react bundlers
            build: vite-react rolldown-react webpack-react rsbuild-react rspack-react esbuild-react bun-react
            dev: vite-react webpack-react rsbuild-react rspack-react esbuild-react bun-react
          - shard: next and react router
            build: next-webpack next-turbopack react-router
            dev: next-webpack next-turbopack react-router
          - shard: vite
            build: vite-preact vite-solid vite-vanilla vite-vue vite-svelte vite-library vite-utilities jest-react
            dev: vite-preact vite-solid vite-vue vite-svelte vite-utilities
          - shard: meta-frameworks
            build: sveltekit nuxt astro qwik solid-start
            dev: sveltekit nuxt astro qwik solid-start
          - shard: react frameworks
            build: tanstack-start vike waku
            dev: tanstack-start vike waku
          # Documentation sites and component workshops.
          - shard: docs and stories
            build: vitepress docusaurus storybook
            dev: vitepress docusaurus storybook
          - shard: angular and ember
            build: analog-angular angular-cli ember
            dev: analog-angular angular-cli ember
          - shard: gatsby, parcel and adonisjs
            build: gatsby parcel adonisjs
            dev: gatsby parcel adonisjs
          - shard: meteor
            build: meteor
            dev: meteor
            meteor: true
          # Server frameworks' own toolchains (D-069).
          - shard: server frameworks
            build: laravel symfony rails phoenix
            dev: laravel symfony rails phoenix
            servers: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages

      - name: Install Chromium
        working-directory: packages/kirana
        run: bunx playwright install --with-deps chromium

      - if: matrix.servers
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer

      - if: matrix.servers
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"

      - if: matrix.servers
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - name: Install Meteor
        if: matrix.meteor
        run: npx -y meteor@3.5.2 && echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Build, then develop, each example
        env:
          BUILD: ${{ matrix.build }}
          DEV: ${{ matrix.dev }}
        run: |
          failed=()
          attempt() {
            local label=$1; shift
            echo "::group::$label"
            local started=$SECONDS
            if "$@"; then
              echo "::endgroup::"
              echo "✓ $label in $((SECONDS - started)) s"
            else
              echo "::endgroup::"
              echo "::error title=$label::$label failed; expand its group in this step's log."
              failed+=("$label")
            fi
          }
          for example in $BUILD; do
            attempt "compat ($example)" bun run kirana:example "$example" --pm npm \
              --atoms "$GITHUB_WORKSPACE/atoms/$example.json"
          done
          for example in $DEV; do
            attempt "dev ($example)" bun run kirana:example "$example" --pm npm --dev
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: atoms-${{ strategy.job-index }}
          path: atoms
          if-no-files-found: ignore
          retention-days: 3

  # The M4 exit criterion (D-056): the same source compiles to the same atoms on every host, so
  # conformance measured on Vite holds for all of them.
  compat-atoms:
    name: compat (same atoms on every host)
    runs-on: ubuntu-26.04
    needs: [examples]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: atoms-*
          path: atoms
          merge-multiple: true

      - name: React on every bundler
        run: >-
          bun packages/kirana/examples/compare-atoms.ts atoms vite-react rolldown-react
          webpack-react rsbuild-react next-webpack next-turbopack bun-react esbuild-react
          tanstack-start vike waku docusaurus

  # Deno as the runtime (KRN-INT-006): installed with npm, built with Deno, native engine through
  # Node-API. (`deno install` links local tarballs as directories, so Deno as the installer waits for
  # the registry — S4-E08-07.)
  runtime-deno:
    name: runtime (deno · ${{ matrix.example }})
    runs-on: ubuntu-26.04
    needs: [pack]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [vite-react, vite-vue]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages

      - name: Install Chromium
        working-directory: packages/kirana
        run: bunx playwright install --with-deps chromium

      - name: ${{ matrix.example }} built on Deno
        run: bun run kirana:example ${{ matrix.example }} --pm npm --runtime deno

  # Alpine: the musl platform packages. No Chromium to drive, so the stylesheet check stands in for
  # the browser one; Node runs the runner through its type stripping. Checkout and artifacts happen on
  # the host and only the install runs in Alpine, because GitHub runs JavaScript actions inside Alpine
  # containers on x64 runners only ("JavaScript Actions in Alpine containers are only supported on x64
  # Linux runners").
  install-musl:
    name: install (alpine ${{ matrix.arch }} · ${{ matrix.pm }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    needs: [pack]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["x64"]' || '["x64", "arm64"]') }}
        pm: [npm, pnpm, bun]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: packages/kirana/dist-packages

      - name: vite-react with ${{ matrix.pm }}
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo node:24-alpine sh -euc "
          apk add --no-cache bash libstdc++ libgcc;
          corepack enable; corepack prepare pnpm@12 --activate;
          npm install --global bun;
          node packages/kirana/examples/run.ts vite-react --pm ${{ matrix.pm }} --no-browser"

  # The one check branch protection requires from this workflow. A skipped matrix job reports a
  # single check under its unexpanded name (`install (${{ matrix.os }} · ${{ matrix.pm }})`), so a
  # required check named after one matrix cell would wait forever whenever `changes` skips its job.
  # This job always runs, and passes when every job passed or was skipped.
  result:
    name: packages result
    if: always()
    needs:
      [
        changes,
        native,
        pack,
        install,
        install-wasi,
        examples,
        compat-atoms,
        runtime-deno,
        install-musl,
      ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
