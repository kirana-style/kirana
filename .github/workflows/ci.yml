name: ci

# A pull request runs everything except macOS determinism; the merge queue (`merge_group`) runs it
# all, once per merge, on the commit that lands on `main` (packages.yml says why). The push to `main`
# keeps the caches warm: only `main` saves them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first one's answer worthless, so
# stop paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned, not `*-latest`: a label that moves re-baselines the determinism
# hashes and the advisory benchmark under us, and GitHub annotates every job that uses one.
#
# Jobs run in parallel and report on their own. The Kirana-only jobs (Rust checks, coverage, the
# helpers, the editors) skip on a change that touches nothing the packages are built from
# (.github/actions/changes); lint, the build and determinism always run, since the site compiles
# through the engine.

jobs:
  changes:
    runs-on: ubuntu-26.04
    name: changes
    timeout-minutes: 5
    outputs:
      kirana: ${{ steps.changes.outputs.kirana }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: changes
        uses: ./.github/actions/changes

  check:
    runs-on: ubuntu-26.04
    name: lint, format and types
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint

      # The Kirana lint rules read the compiler, so the linter needs the native engine. A cached
      # task: restored, not rebuilt, while the Rust workspace is unchanged.
      - name: Build the native engine
        run: vp run engine

      # Separate steps so a red build names the stage that failed. The same checks run in the
      # pre-push hook (`vp run prepush`).
      - name: Format
        run: vp fmt --check

      # Oxlint with the Kirana rules, and the TypeScript type check (tsgolint) in the same pass.
      - name: Lint and types
        run: vp lint

      # The docs' generated data (diagnostics, lint rules, packages, commands, the agent skills'
      # references) must match the source, and no page may contradict it: a hand-typed count, a
      # partial list, a product without its logo (apps/docs/CONSISTENCY.md). Needs the engine above.
      - name: Generated docs and consistency
        run: vp run verify

      # Every installed JavaScript dependency's licence against scripts/check-licenses.ts; the Rust
      # ones are cargo-deny's, in kirana · rust checks.
      - name: Licences
        run: vp run licenses

      # The docs content engine (packages/docs-core): Markdown, highlighting and the changelog,
      # held to its coverage floor (its vitest.config.ts).
      - name: Docs content engine tests
        run: vp run test:docs

  kirana-rust:
    runs-on: ubuntu-26.04
    name: kirana · rust checks
    needs: [changes]
    if: needs.changes.outputs.kirana == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/kirana

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-deny

      - name: rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Licences (MPL-2.0 allowed for Lightning CSS only as a dependency), advisories, sources.
      - name: cargo-deny
        run: cargo deny check

      # The property tables are generated from mdn-data; the committed file must match.
      - name: Generated CSS data is current
        run: bun run gen:css-data && git diff --exit-code crates/kirana_css_data/src/generated.rs

      # @kirana-style/preset-scales is generated from the pinned tailwindcss theme; the committed file must match.
      - name: Generated preset scales are current
        run: bun run gen:preset-scales && git diff --exit-code npm/preset-scales/src/scales.ts

      # @kirana-style/states is generated from the pinned @base-ui/react declarations; the committed file must match.
      - name: Generated states are current
        run: bun run gen:states && git diff --exit-code npm/states/src/base-ui.ts

  kirana-coverage:
    runs-on: ubuntu-26.04
    name: kirana · tests and 100% coverage
    needs: [changes]
    if: needs.changes.outputs.kirana == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest,cargo-llvm-cov
          cache-key: coverage

      # Rust unit, snapshot and golden-fixture tests; Vitest against an instrumented native
      # addon; both reports fail below 100 % (lines and functions for Rust; every metric for
      # TypeScript).
      - name: Tests with coverage
        working-directory: packages/kirana
        run: scripts/coverage.sh

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kirana-coverage
          path: packages/kirana/coverage
          if-no-files-found: ignore

  # The template helpers for server frameworks (D-069), each in its own language, each held to the
  # runtime's merge by fixtures/merge/vectors.json and to 100 % coverage (PHP: lines and methods;
  # Ruby: lines and branches; Elixir: lines).
  kirana-helpers:
    runs-on: ubuntu-26.04
    name: kirana · ${{ matrix.language }} helper
    needs: [changes]
    if: needs.changes.outputs.kirana == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [php, ruby, elixir]
    defaults:
      run:
        working-directory: packages/kirana/helpers/${{ matrix.language }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer

      - if: matrix.language == 'ruby'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"

      - if: matrix.language == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - name: PHPUnit with coverage
        if: matrix.language == 'php'
        run: composer install --no-interaction && composer run coverage

      - name: Minitest with SimpleCov
        if: matrix.language == 'ruby'
        run: bundle install && bundle exec rake test

      - name: ExUnit with coverage
        if: matrix.language == 'elixir'
        run: mix test --cover

  # The editor side of M3 (sprint 6): the VS Code extension in a real VS Code against the real
  # language server, its .vsix, and the Zed extension's WebAssembly build. The lint plugin's rule and
  # Oxlint/ESLint parity tests, and the extension's unit tests, run in kirana-coverage with Vitest.
  kirana-editors:
    runs-on: ubuntu-26.04
    name: kirana · editors
    needs: [changes]
    if: needs.changes.outputs.kirana == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: editors

      # The fixture's `node_modules/.bin/kirana` runs the compiler entry, TypeScript, with Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Build the native engine
        working-directory: packages/kirana/npm/compiler
        run: bun run build:debug

      # VS Code is downloaded and run on Electron's headless platform: no display server needed.
      - name: VS Code extension, end to end
        working-directory: packages/kirana/editors/vscode
        run: bun run test:e2e

      - name: Package the VS Code extension
        working-directory: packages/kirana/editors/vscode
        run: bun run package

      # Outside the engine's Cargo workspace, with its own toolchain file naming the target.
      - name: Zed extension
        working-directory: packages/kirana/editors/zed
        run: |
          rustup target add wasm32-wasip2
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target wasm32-wasip2

      - name: Upload the editor builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kirana-editors
          path: |
            packages/kirana/editors/vscode/kirana.vsix
            packages/kirana/editors/zed/target/wasm32-wasip2/release/kirana_zed.wasm

  build:
    runs-on: ubuntu-26.04
    name: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release

      # The native engine first (the `engine` task), then the docs site; both cached tasks.
      - name: Build
        run: vp run build

      # Output size and type cost against packages/kirana/budgets/budgets.json, with the
      # difference in the job summary; the site's stylesheet is printed beside it, not gated.
      - name: Budgets
        run: bun run --cwd packages/kirana budgets --check --summary

      # The site ships `light-dark()` as written (D-026). A CSS minifier aiming below that floor
      # rewrites it into `--lightningcss-light/dark` switches that nothing sets, and the colours
      # vanish in production only: the dev server does not minify.
      - name: Colours survive the build
        run: |
          if grep -rl -- "--lightningcss-" apps/docs/dist/client/assets; then
            echo "::error::a built stylesheet lowered light-dark(); set build.cssTarget to Kirana's floor"
            exit 1
          fi

  determinism:
    name: kirana · determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS in the merge queue and by hand only: the organisation has five macOS runners for
        # every contributor's pull requests at once.
        os: ${{ fromJSON(contains(fromJSON('["merge_group", "workflow_dispatch"]'), github.event_name) && '["ubuntu-26.04", "ubuntu-26.04-arm", "macos-26", "windows-2025"]' || '["ubuntu-26.04", "ubuntu-26.04-arm", "windows-2025"]') }}

    steps:
      # Byte-identical output must not depend on line endings in the checkout.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed workspace links (`@workspace/ui`, `@kirana-style/preset-scales`) are part of the
      # compiler's input: without them every imported token is an unresolved runtime value.
      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          cache-key: determinism

      # The same sources compiled with one thread and with all threads (KRN-OUT-006, KRN-TEST-005).
      - name: Build the stylesheet twice
        shell: bash
        run: |
          cargo build --release --manifest-path packages/kirana/Cargo.toml -p kirana_cli
          kirana=packages/kirana/target/release/kirana-style
          config='{"layers":{"before":["reset","base"]}}'
          RAYON_NUM_THREADS=1 "$kirana" --config-json "$config" build packages/ui/src packages/shell/src packages/docs-ui/src apps/docs/src --out one.css --minify
          "$kirana" --config-json "$config" build packages/ui/src packages/shell/src packages/docs-ui/src apps/docs/src --out all.css --minify
          cmp one.css all.css
          test -s one.css
          if command -v sha256sum > /dev/null; then sha256sum one.css; else shasum -a 256 one.css; fi | cut -d' ' -f1 > stylesheet.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: determinism-${{ matrix.os }}
          path: stylesheet.sha256

  determinism-compare:
    runs-on: ubuntu-26.04
    name: kirana · determinism across platforms
    needs: [determinism]
    timeout-minutes: 5

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: determinism-*

      - name: Every platform produced the same stylesheet
        run: |
          cat determinism-*/stylesheet.sha256
          test "$(cat determinism-*/stylesheet.sha256 | sort -u | wc -l)" -eq 1

  # The one check branch protection requires from this workflow. A skipped matrix job reports a
  # single check under its unexpanded name (`kirana · ${{ matrix.language }} helper`), so a required check named after one matrix
  # cell would wait forever whenever `changes` skips its job. This job always runs, and passes when
  # every job passed or was skipped.
  result:
    name: ci result
    if: always()
    needs:
      [
        changes,
        check,
        kirana-rust,
        kirana-coverage,
        kirana-helpers,
        kirana-editors,
        build,
        determinism,
        determinism-compare,
      ]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job ended in $result"; exit 1 ;;
            esac
          done
