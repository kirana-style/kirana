name: release

# One version for everything (operations/release.md in kirana-spec). On every push to main,
# release-please keeps a Release PR open: the next version, read from the Conventional Commit titles
# since the last tag, bumped in every package.json, Cargo.toml, the gemspec, mix.exs and the editor
# extensions, with CHANGELOG.md. Merging that PR tags vX.Y.Z and creates the GitHub release; this
# workflow then builds every platform, runs the installation matrix as the gate, publishes, asks
# every registry for the version (`verify`), and asks kirana-lab to benchmark it once npm serves it
# (`bench`):
#
#   npm (23 packages + 9 engine packages: 8 native, 1 WASI) · RubyGems · Hex · VS Code Marketplace · Open VSX ·
#   the kirana-php mirror and the kirana/kirana alias (Packagist reads their tags)
#
# Publishing jobs run in the `release` environment, which requires an approval, so nothing reaches a
# registry without a person saying so. npm, RubyGems and Open VSX authenticate with trusted publishing (OIDC);
# the rest read secrets scoped to that environment.

on:
  push:
    branches: [main]
  # By hand (Actions → release → Run workflow), e.g. after a startup failure, which cannot be re-run.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an existing release again, to these targets only (comma-separated: npm, rubygems, hex, editors, php). Empty: the normal release-please run."
        required: false
        default: ""
      tag:
        description: "The release tag those targets publish, e.g. v0.1.0 (the files on main must carry that version)."
        required: false
        default: ""

permissions:
  contents: read

# The commits and pushes below (lockfiles, the PHP mirror) are CI's own: the developer git hooks
# that `vp config` installs (.vite-hooks) must not run on them.
env:
  VP_GIT_HOOKS: "0"

# Releases queue rather than cancel: a half-published release must finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr-branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}

    steps:
      # A token other than GITHUB_TOKEN, so the Release PR's commits start CI like any other PR's.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The Release PR bumps every version; files derived from the version must follow, or its CI fails:
  # bun.lock and Cargo.lock (CI installs frozen) and the docs' generated package list
  # (apps/docs/src/generated/packages.gen.ts, checked by verify:generated). This job rebuilds them on
  # the Release PR's branch after every push to main, whether or not release-please changed the PR
  # this time (a ci: or chore: merge leaves it untouched but still moves main under it).
  lockfiles:
    needs: release-please
    if: needs.release-please.outputs.created != 'true' && inputs.publish == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Find the open Release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: ${{ needs.release-please.outputs.pr-branch }}
        run: |
          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
              --json headRefName --jq '.[0].headRefName // ""')
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.branch != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN }}

      # Node.js and Bun only: the install below must be free to rewrite bun.lock.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        if: steps.pr.outputs.branch != ''
        with:
          node-version-file: .node-version
          run-install: false

      - uses: ./.github/actions/setup-rust
        if: steps.pr.outputs.branch != ''
        with:
          cache-key: release

      # Release Please rewrites the Release PR only when its notes change, so the branch can lag main's
      # release-please-config.json: a package listed there after the PR was last written keeps its old
      # version, and the site's one-version check fails the PR. Every npm package takes the
      # manifest's version first. The step is written here, not in a script, because it runs on the
      # Release PR's files, which may predate any script added for it.
      - name: Give every npm package the release's version
        if: steps.pr.outputs.branch != ''
        run: |
          bun -e '
            const fs = require("node:fs")
            const version = JSON.parse(fs.readFileSync(".release-please-manifest.json", "utf8"))["."]
            for (const name of fs.readdirSync("packages/kirana/npm")) {
              const file = `packages/kirana/npm/${name}/package.json`
              if (!fs.existsSync(file)) continue
              const text = fs.readFileSync(file, "utf8")
              const next = text.replace(/"version": "[^"]*"/, `"version": "${version}"`)
              if (next !== text) console.log(`${file}: ${version}`)
              fs.writeFileSync(file, next)
            }
          '

      - name: Refresh the lockfiles and the generated files
        if: steps.pr.outputs.branch != ''
        run: |
          bun install
          (cd packages/kirana && cargo update --workspace)
          # The generators that read versions; none of them needs the native engine. Reference first:
          # the pages' facts (`{{fact:version}}`, the counts) are read from the files it writes.
          bun run --cwd apps/docs generate:reference
          bun run --cwd apps/docs generate:content
          bun run --cwd apps/docs generate:skills

      # Release-please links a squash-merged pull request's `(#N)` as `/issues/N`; the changelog, and
      # the site's changelog page read from it, link the pull request itself.
      - name: Link pull requests, not issues, in the changelog
        if: steps.pr.outputs.branch != ''
        run: |
          sed -E -i "s#(https://github\.com/$GITHUB_REPOSITORY)/issues/([0-9]+)#\1/pull/\2#g" CHANGELOG.md

      - name: Commit them to the Release PR
        if: steps.pr.outputs.branch != ''
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "Kirana"
          git config user.email "dev@kirana.style"
          git commit -m "chore: refresh lockfiles and generated files for the release"
          git push

  # A release's notes come from the Release PR's description, where release-please links each
  # pull request as `/issues/N`. Every published release's notes link the pull request instead,
  # rewritten on each run, so a release is corrected as soon as it is created and an older one on the
  # next run.
  release-notes:
    needs: release-please
    if: inputs.publish == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Link pull requests, not issues, in every release's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
              sed -E "s#(https://github\.com/$GITHUB_REPOSITORY)/issues/([0-9]+)#\1/pull/\2#g" notes.md > fixed.md
              if ! cmp -s notes.md fixed.md; then
                gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file fixed.md > /dev/null
                echo "$tag: pull request links"
              fi
            done

  # The full build, pack and installation matrix, every OS and all nine engines, on the tagged
  # commit: what is published is exactly what passed. The merge queue runs Linux only, so this gate
  # and the nightly run are where macOS and Windows installs are tested.
  packages:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'npm')
    uses: ./.github/workflows/packages.yml
    permissions:
      contents: read

  npm:
    needs: [release-please, packages]
    # A release, or a re-publish of this target (workflow_dispatch). `packages` may be skipped then.
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'npm'))
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          run-install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@12

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kirana-packages
          path: dist-packages

      # Every package under its final tag, a dependency level at a time, each level once no CDN edge
      # can serve the one before it without its new version (the script's header says why).
      - name: Publish, a dependency level at a time
        run: bun packages/kirana/scripts/publish-npm.ts dist-packages

  rubygems:
    needs: [release-please, packages]
    # A release, or a re-publish of this target (workflow_dispatch). `packages` may be skipped then.
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'rubygems'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/kirana/helpers/ruby

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build and push the gem
        run: |
          gem build kirana.gemspec
          gem push kirana-*.gem

  hex:
    needs: [release-please, packages]
    # A release, or a re-publish of this target (workflow_dispatch). `packages` may be skipped then.
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'hex'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    defaults:
      run:
        working-directory: packages/kirana/helpers/elixir

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          mix deps.get
          mix hex.publish --yes

  editors:
    needs: [release-please, packages]
    # A release, or a re-publish of this target (workflow_dispatch). `packages` may be skipped then.
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'editors'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      # Open VSX trusted publishing: a short-lived token for this workflow and environment.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Package the extension
        working-directory: packages/kirana/editors/vscode
        run: bun run package

      # Attached to the GitHub release in every case: without VSCE_PAT (an Azure DevOps organization
      # needs an Azure subscription), the .vsix is uploaded by hand at
      # marketplace.visualstudio.com/manage → kirana-style → Kirana → Update.
      - name: Attach the .vsix to the GitHub release
        working-directory: packages/kirana/editors/vscode
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: gh release upload "$TAG" kirana.vsix --clobber

      - name: Publish to the VS Code Marketplace
        working-directory: packages/kirana/editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::No VSCE_PAT: upload kirana.vsix from the GitHub release to the Marketplace by hand."
            exit 0
          fi
          bunx @vscode/vsce publish --packagePath kirana.vsix

      # Trusted publishing (no stored token): Open VSX accepts this repository's release.yml in the
      # `release` environment for the kirana-style namespace (open-vsx.org → Trusted Publishers).
      - name: Publish to Open VSX
        working-directory: packages/kirana/editors/vscode
        run: bunx ovsx@1.2.0 publish kirana.vsix --trusted-publishing

  # Packagist reads packages from Git tags: the PHP helper is split out of this repository into the
  # read-only kirana-php mirror (kirana-style/kirana), and the kirana/kirana alias gets the same tag.
  php:
    needs: [release-please, packages]
    # A release, or a re-publish of this target (workflow_dispatch). `packages` may be skipped then.
    if: >-
      !failure() && !cancelled() &&
      (needs.release-please.outputs.created == 'true' || contains(inputs.publish, 'php'))
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One fine-grained token (PHP_MIRROR_TOKEN: Contents read and write on kirana-php and
      # kirana-php-alias only); the organization disables deploy keys.
      - name: Push the split and the tag to kirana-php
        env:
          TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          git subtree split --prefix=packages/kirana/helpers/php -b php
          git push --force "https://x-access-token:${TOKEN}@github.com/kirana-style/kirana-php.git" php:main
          # Pushed straight to the mirror's tag ref: a local tag of that name already exists, this
          # repository's own release tag.
          git push "https://x-access-token:${TOKEN}@github.com/kirana-style/kirana-php.git" "php:refs/tags/$TAG"

      - name: Tag the kirana/kirana alias
        env:
          TOKEN: ${{ secrets.PHP_MIRROR_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/kirana-style/kirana-php-alias.git" "$RUNNER_TEMP/alias"
          cd "$RUNNER_TEMP/alias"
          git tag "$TAG"
          git push origin "$TAG"

  # Every registry serves the version: a target that quietly did not publish (Packagist missing the
  # tag) shows as a failed job instead of being found later. Open VSX holding the upload for review
  # is a warning and a missing hand upload to the Marketplace a notice, so neither keeps the release
  # waiting. It runs after the publish jobs even when one failed, so the summary is complete; public
  # APIs only.
  verify:
    needs: [release-please, npm, rubygems, hex, editors, php]
    if: >-
      !cancelled() &&
      (needs.release-please.outputs.created == 'true' || inputs.publish != '')
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          run-install: false

      - name: Ask every registry for the release
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: bun packages/kirana/scripts/verify-release.ts "$TAG"

  # Once npm serves the release (the `npm` job ends only when it does), kirana-lab measures it against
  # StyleX and Tailwind (its bench workflow, about three hours); the `benchmarks` workflow then takes
  # the results into the site. The lab installs from npm only, so it waits for no other registry.
  # KIRANA_LAB_DISPATCH is a fine-grained token with Contents read and write on kirana-lab only,
  # which is what a repository_dispatch needs. Only a release is measured, not a re-publish.
  bench:
    needs: [release-please, npm]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Ask kirana-lab to measure the release
        env:
          GH_TOKEN: ${{ secrets.KIRANA_LAB_DISPATCH }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh api repos/kirana-style/kirana-lab/dispatches \
            -f event_type=kirana-release \
            -f "client_payload[version]=${TAG#v}"
