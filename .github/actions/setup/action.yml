name: Setup
description: Vite+ with Node.js, Bun and the workspace installed, and the task cache restored.

# Every job needs the same things, and each one used to spell them out. Kept here so the workflow
# reads as a graph of jobs rather than as the same install block copied per job.

runs:
  using: composite

  steps:
    # `vp` provides Node.js (the version in .node-version) and Bun (package.json's `packageManager`),
    # the same pins `vp env` uses on a developer's machine, so CI and local development cannot drift
    # apart; it also caches the dependency download and runs `vp install`.
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        cache: true
        run-install: |
          - args: ["--frozen-lockfile"]

    # The `vp run` task cache (vite.config.ts → run.tasks): a task whose inputs did not change
    # replays its output and restores its files, the native engine above all. Each run on `main`
    # saves a new entry, and every run restores the newest one for its job and platform; other
    # branches only restore, so their entries never evict main's (setup-rust does the same). Vite
    # Task fingerprints the inputs itself, so none belong in the key.
    - name: Cache vp tasks
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

    - name: Restore vp tasks
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/task-cache
        key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
