# Updates arrive as pull requests, grouped so a week's updates are one review, not twenty.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Must never be newer than the extension's engines.vscode (vsce refuses to package), and raising
      # that drops older VS Code and the forks (Cursor, Windsurf, Antigravity). Bump both by hand,
      # together, when a newer API is needed.
      - dependency-name: "@types/vscode"
      # Vite+ fixes the versions of what it bundles: the `vite` alias to its core, Vitest and the
      # coverage provider all move with `vite-plus`, through its own upgrade (`vp migrate`), never
      # one by one (kirana-spec operations/dependencies.md).
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
      # The parity test runs Oxlint itself; it stays at the version Vite+ bundles.
      - dependency-name: "oxlint"
      # emnapi 2.0.0-beta renames napiModule to addonModule. @napi-rs/wasm-runtime bundles emnapi's
      # plugins when it is built, and 1.2.5 was built with the alpha, so it writes napiModule and the
      # WASI engine fails to load ("setting 'initWorker'"). napi-rs moved to the beta on main; take
      # it with the first wasm-runtime release after 1.2.5. The install (wasi · npm) job proves it.
      - dependency-name: "emnapi"
        versions: [">= 2.0.0-beta.1"]
      - dependency-name: "@emnapi/core"
        versions: [">= 2.0.0-beta.1"]
      - dependency-name: "@emnapi/runtime"
        versions: [">= 2.0.0-beta.1"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /packages/kirana
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # oxc's crates share one version and are pinned exactly (=0.x.y): one alone does not compile,
      # so they always move together. Listed before minor-and-patch, which would otherwise take them.
      oxc:
        patterns:
          - "oxc_allocator"
          - "oxc_ast"
          - "oxc_ast_visit"
          - "oxc_parser"
          - "oxc_semantic"
          - "oxc_span"
          - "oxc_syntax"
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /packages/kirana/helpers/ruby
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: mix
    directory: /packages/kirana/helpers/elixir
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: composer
    directory: /packages/kirana/helpers/php
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
