# Updates arrive as pull requests, grouped so a week's updates are one review, not twenty.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Must never be newer than the extension's engines.vscode (vsce refuses to package), and raising
      # that drops older VS Code and the forks (Cursor, Windsurf, Antigravity). Bump both by hand,
      # together, when a newer API is needed.
      - dependency-name: "@types/vscode"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /packages/kirana
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /packages/kirana/helpers/ruby
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: mix
    directory: /packages/kirana/helpers/elixir
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: composer
    directory: /packages/kirana/helpers/php
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
