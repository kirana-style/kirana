# Updates arrive as pull requests, grouped so a week's updates are one review, not twenty.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Must never be newer than the extension's engines.vscode (vsce refuses to package), and raising
      # that drops older VS Code and the forks (Cursor, Windsurf, Antigravity). Bump both by hand,
      # together, when a newer API is needed.
      - dependency-name: "@types/vscode"
      # Vite+ fixes the versions of what it bundles: the `vite` alias to its core, Vitest and the
      # coverage provider all move with `vite-plus`, through its own upgrade (`vp migrate`), never
      # one by one (kirana-spec operations/dependencies.md).
      - dependency-name: "vite-plus"
      - dependency-name: "vite"
      - dependency-name: "vitest"
      - dependency-name: "@vitest/coverage-v8"
      # The parity test runs Oxlint itself; it stays at the version Vite+ bundles.
      - dependency-name: "oxlint"
      # The Ark UI states vocabulary is generated from it, at the Zag version Ark UI depends on
      # (npm/states/README.md): it moves by hand with `@ark-ui/react`, and `gen:states` with it.
      - dependency-name: "@zag-js/docs"
    groups:
      # The WASI engine (KRN-INT-006) is linked against emnapi and loaded by @napi-rs/wasm-runtime,
      # whose peer range on emnapi 2 names one prerelease: its 1.2.6 moved that from the alpha to
      # 2.0.0-beta.2, and an install that mixed the two could not load the engine
      # ("this.bridge.setLastError is not a function"). Both are pinned exactly and move together,
      # with the CLI that writes the loaders; the install (wasi · npm) job proves each move. Listed
      # before minor-and-patch, which would otherwise take them.
      napi:
        patterns: ["emnapi", "@emnapi/*", "@napi-rs/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /packages/kirana
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      # oxc's crates share one version and are pinned exactly (=0.x.y): one alone does not compile,
      # so they always move together. Listed before minor-and-patch, which would otherwise take them.
      oxc:
        patterns:
          - "oxc_allocator"
          - "oxc_ast"
          - "oxc_ast_visit"
          - "oxc_parser"
          - "oxc_semantic"
          - "oxc_span"
          - "oxc_syntax"
      # napi-rs's crates, pinned exactly like its packages in the bun group, and moved with them.
      napi:
        patterns: ["napi", "napi-derive", "napi-build"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: bundler
    directory: /packages/kirana/helpers/ruby
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: mix
    directory: /packages/kirana/helpers/elixir
    schedule:
      interval: monthly
    commit-message:
      prefix: deps

  - package-ecosystem: composer
    directory: /packages/kirana/helpers/php
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
