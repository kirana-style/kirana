[package]
name = "kirana_napi"
description = "Node-API binding for the Kirana compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
kirana_cli = { workspace = true }
kirana_diagnostics = { workspace = true }
kirana_frontend = { workspace = true }
kirana_lsp = { workspace = true }
kirana_project = { workspace = true }
kirana_shared = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# mimalloc for every native engine (D-123); the WASI one keeps wasi-libc's allocator. The engine is
# loaded with `dlopen`, and on musl a library loaded that way cannot rely on initial-exec TLS.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { workspace = true }
libmimalloc-sys = { workspace = true }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { workspace = true, features = ["local_dynamic_tls"] }

[build-dependencies]
napi-build = { workspace = true }

[lints.rust]
unsafe_code = "allow"
