[package]
name = "kirana-example-tauri"
version = "0.1.0"
description = "Kirana on Tauri"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which Windows needs.
name = "kirana_example_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
